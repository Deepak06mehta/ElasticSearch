# =============================================================================
# Job: set-kibana-password
# Runs AFTER the StatefulSet is ready. Connects to the ES API and sets the
# kibana_system user's password to the value from the elastic-credentials
# secret. This must be done via the API because ES 8.x does not honour
# env-var-based passwords for the kibana_system user on first boot.
#
# The job waits for:
#   1. ES HTTP endpoint to return 401 (ready to accept requests).
#   2. Cluster health API to return 200 (cluster state recovered).
# Then it POSTs the password change.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: set-kibana-password
  namespace: elk
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: set-password
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
          command: ["/bin/bash", "-c"]

          # --- Environment Variables (from static secret) --------------------
          env:
            # The elastic superuser password — used to authenticate the API call.
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: elastic-password

            # The desired kibana_system password — set by the API call.
            - name: KIBANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: kibana-password

          args:
            - |
              # Step 1: Wait for ES to be reachable.
              # The readiness probe returns 401 when ES is up and TLS works.
              echo "Waiting for Elasticsearch to be up..."
              until curl -sk https://elasticsearch-0.elasticsearch:9200 -o /dev/null -w "%{http_code}" | grep -q "401"; do
                echo "  waiting for 401 response..."
                sleep 5
              done

              # Step 2: Wait for cluster state to fully recover.
              # Authenticate with the elastic user and check for HTTP 200.
              echo "Waiting for cluster state to recover..."
              until curl -sk -u "elastic:${ELASTIC_PASSWORD}" \
                https://elasticsearch-0.elasticsearch:9200/_cluster/health -o /dev/null -w "%{http_code}" | grep -q "200"; do
                echo "  waiting for cluster health 200..."
                sleep 5
              done

              # Step 3: Set the kibana_system password via the Security API.
              echo "Setting kibana_system password..."
              STATUS=$(curl -sk -o /dev/null -w "%{http_code}" -X POST \
                -u "elastic:${ELASTIC_PASSWORD}" \
                -H "Content-Type: application/json" \
                https://elasticsearch-0.elasticsearch:9200/_security/user/kibana_system/_password \
                -d "{\"password\":\"${KIBANA_PASSWORD}\"}")

              # Step 4: Verify the API call succeeded.
              if [ "$STATUS" = "200" ]; then
                echo "kibana_system password set successfully"
              else
                echo "ERROR: Failed to set kibana_system password (HTTP $STATUS)"
                exit 1
              fi
