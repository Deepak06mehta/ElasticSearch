# =============================================================================
# Secret: elastic-credentials
# Stores the elastic superuser password and the kibana_system password.
# Both are referenced by env vars in the StatefulSet, Kibana Deployment,
# and the set-password-job.
#
# IMPORTANT: Change these passwords before production use.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: elastic-credentials
  namespace: elk
type: Opaque
stringData:
  # Password for the built-in elastic superuser.
  # Used by the StatefulSet via ELASTIC_PASSWORD env var.
  elastic-password: elastic123

  # Password for the built-in kibana_system user.
  # Set initially here, then applied to ES by the set-password-job.
  kibana-password: kibana123
