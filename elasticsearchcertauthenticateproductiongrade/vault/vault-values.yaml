global:
  enabled: true
server:
  dev:
    enabled: true
    devRootToken: root
  dataStorage:
    enabled: false
  standalone:
    enabled: true
  ha:
    enabled: false
  service:
    enabled: true
    type: ClusterIP
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 100m
injector:
  enabled: false
