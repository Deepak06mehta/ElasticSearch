# =============================================================================
# secret-store.yaml — ClusterSecretStore for Vault
# =============================================================================
# Purpose: Defines a ClusterSecretStore that tells External Secrets Operator
# (ESO) HOW to connect to Vault to retrieve secrets.
#
# WHAT IS A SECRETSTORE?
# A SecretStore is a configuration object that defines a connection to an
# external secrets provider (Vault, AWS Secrets Manager, GCP Secret Manager,
# Azure Key Vault, etc.). ESO uses this to authenticate and fetch secrets.
#
# ClusterSecretStore vs SecretStore:
#   - ClusterSecretStore: cluster-scoped — can be used from ANY namespace.
#   - SecretStore: namespace-scoped — only usable within its own namespace.
#   We use ClusterSecretStore because ExternalSecret resources in the 'elk'
#   namespace need to reference it.
#
# AUTHENTICATION FLOW:
#   1. ESO's service account (external-secrets/external-secrets) has a JWT
#      token mounted at /var/run/secrets/kubernetes.io/serviceaccount/token
#   2. ESO sends this JWT to Vault's auth/kubernetes/login endpoint
#   3. Vault calls Kubernetes TokenReview API to validate the JWT
#   4. If valid, Vault checks the role (external-secrets) for permissions
#   5. Vault returns a short-lived Vault token with the eso-es-policy attached
#   6. ESO uses this Vault token to read secrets from secret/data/elasticsearch
# =============================================================================

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      # server: The URL of the Vault server. DNS resolves within the cluster
      # as: vault.elk.svc.cluster.local:8200 → vault-0 pod IP.
      # Note: HTTP not HTTPS (Vault dev mode has TLS disabled).
      server: http://vault.elk.svc:8200

      # path: The mount path of the KV secrets engine in Vault.
      # Must match what was configured in configure-vault-job.yaml
      # (vault secrets enable -path=secret kv-v2).
      path: secret

      # version: The KV engine version. v2 adds versioning and metadata.
      # When reading, add /data/ to the path: secret/data/elasticsearch
      version: v2

      auth:
        # Kubernetes auth method: uses a service account JWT to authenticate.
        kubernetes:
          # mountPath: The path where the Kubernetes auth method was enabled
          # in Vault (vault auth enable -path=kubernetes).
          mountPath: kubernetes

          # role: The Vault role that maps to the eso-es-policy.
          # Must match the role created in configure-vault-job.yaml:
          # vault write auth/kubernetes/role/external-secrets ...
          role: external-secrets

          # serviceAccountRef: The Kubernetes service account whose JWT token
          # ESO will use to authenticate to Vault. ESO's own controllers use
          # this SA, and Vault validates the token via the TokenReview API.
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
