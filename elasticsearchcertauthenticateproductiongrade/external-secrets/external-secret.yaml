# =============================================================================
# external-secret.yaml — ExternalSecret for Elasticsearch Credentials
# =============================================================================
# Purpose: Defines an ExternalSecret resource that tells ESO to SYNC the
# passwords from Vault into a regular Kubernetes Secret.
#
# HOW IT WORKS:
#   1. ESO watches all ExternalSecret resources in the cluster
#   2. For each ExternalSecret, it connects to the referenced SecretStore
#      (vault-backend → Vault)
#   3. It authenticates to Vault using Kubernetes auth (JWT → Vault token)
#   4. It reads the specified keys from Vault (secret/data/elasticsearch)
#   5. It creates/updates a Kubernetes Secret with the retrieved values
#   6. It repeats this process every refreshInterval (1 hour) or when
#      Vault data changes (if webhook is configured)
#
# RESULTING KUBERNETES SECRET:
#   Name: elastic-credentials
#   Namespace: elk
#   Data:
#     elastic-password: elastic123  (base64 encoded)
#     kibana-password:  kibana123   (base64 encoded)
#
# THIS SECRET IS CONSUMED BY:
#   - es-master-data-0: env.ELASTIC_PASSWORD (for setting ES password)
#   - es-ingest-0:      env.ELASTIC_PASSWORD
#   - kibana:           env.ELASTICSEARCH_PASSWORD (kibana_system user)
#   - set-kibana-password-job: env.ELASTIC_PASSWORD + KIBANA_PASSWORD
#
# CREATION POLICY: Owner
#   If the ExternalSecret is deleted, the resulting k8s Secret is also
#   deleted. This prevents orphaned secrets.
#
# DELETION POLICY: Delete
#   When the remote secret is deleted in Vault, ESO deletes the k8s Secret.
# =============================================================================

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elastic-credentials
  namespace: elk
spec:
  # refreshInterval: How often ESO checks Vault for updates.
  # 1 hour is reasonable for dev. Production might use shorter intervals
  # for rotated secrets or longer intervals for static passwords.
  refreshInterval: 1h

  # secretStoreRef: Points to the ClusterSecretStore that defines the
  # connection parameters for Vault.
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  target:
    # name: The name of the Kubernetes Secret that will be created/updated.
    # This is the name that Elasticsearch and Kibana reference in their env vars.
    name: elastic-credentials

    # creationPolicy: Owner means the ExternalSecret "owns" the k8s Secret.
    # Deleting the ExternalSecret cascades to delete the Secret.
    creationPolicy: Owner

    # deletionPolicy: Delete means the k8s Secret is deleted when the
    # remote secret is removed from Vault.
    deletionPolicy: Delete

  # data: Maps remote Vault keys to local k8s Secret keys.
  data:
    # elastic-password: Read from Vault path secret/data/elasticsearch,
    # property elastic-password, store as key "elastic-password" in the k8s Secret.
    - secretKey: elastic-password
      remoteRef:
        key: elasticsearch
        property: elastic-password

    # kibana-password: Same path, different property.
    - secretKey: kibana-password
      remoteRef:
        key: elasticsearch
        property: kibana-password
