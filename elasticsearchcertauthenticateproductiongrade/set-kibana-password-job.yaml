# =============================================================================
# set-kibana-password-job.yaml — Set Kibana System Password
# =============================================================================
# Purpose: Job that sets the kibana_system user's password in Elasticsearch.
#
# WHY IS THIS NECESSARY?
#   Elasticsearch 8.x auto-configures the kibana_system user with a random
#   password at first boot. We store our own password (kibana123) in Vault.
#   To use our managed password, we must POST to the Security API after
#   ES is up to change kibana_system's password.
#
# WHAT IF WE SKIP THIS STEP?
#   Kibana would start but fail to authenticate to Elasticsearch because
#   the password in the k8s Secret (from Vault) doesn't match the
#   auto-generated password in ES.
#
# JOB EXECUTION FLOW:
#   1. Wait for ES to be up (HTTP 401 on https://elasticsearch:9200)
#   2. Wait for cluster health to return 200 (cluster is ready)
#   3. POST to _security/user/kibana_system/_password with new password
#   4. Exit 0 on success, exit 1 on failure (Job shows Failed if error)
#
# ORDERING NOTE:
#   This job runs BEFORE Kibana is deployed. This ensures the password
#   is set before Kibana first connects — avoiding an extra restart.
# =============================================================================

apiVersion: batch/v1
kind: Job
metadata:
  name: set-kibana-password
  namespace: elk
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: set-password
          # Uses the same ES image as the cluster — it has curl + the
          # necessary TLS support. No need for a separate curl container.
          image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
          command: ["/bin/bash", "-c"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "50m"
          env:
            # ELASTIC_PASSWORD: The elastic superuser password (from Vault).
            # Used to authenticate the API call to change kibana_system's password.
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: elastic-password
            # KIBANA_PASSWORD: The new password to set for kibana_system.
            # This value was stored in Vault and synced by ESO.
            - name: KIBANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: kibana-password
          args:
            - |
              echo "Waiting for Elasticsearch to be up..."

              # Step 1: Wait for HTTP 401 (security layer is up, ready for auth)
              # The endpoint https://elasticsearch:9200 returns 401 when ES is
              # running but no credentials are provided. A connection refused
              # or timeout means ES isn't ready yet.
              until curl -sk https://elasticsearch:9200 -o /dev/null -w "%{http_code}" | grep -q "401"; do
                echo "  waiting for 401 response..."
                sleep 5
              done

              # Step 2: Wait for cluster health to return 200
              # After ES is up, the cluster needs a moment to elect a master
              # and allocate shards. We wait until _cluster/health returns 200.
              echo "Waiting for cluster state to recover..."
              until curl -sk -u "elastic:${ELASTIC_PASSWORD}" \
                https://elasticsearch:9200/_cluster/health -o /dev/null -w "%{http_code}" | grep -q "200"; do
                echo "  waiting for cluster health 200..."
                sleep 5
              done

              # Step 3: Set the kibana_system password
              echo "Setting kibana_system password..."
              STATUS=$(curl -sk -o /dev/null -w "%{http_code}" -X POST \
                -u "elastic:${ELASTIC_PASSWORD}" \
                -H "Content-Type: application/json" \
                https://elasticsearch:9200/_security/user/kibana_system/_password \
                -d "{\"password\":\"${KIBANA_PASSWORD}\"}")

              if [ "$STATUS" = "200" ]; then
                echo "kibana_system password set successfully"
              else
                echo "ERROR: Failed to set kibana_system password (HTTP $STATUS)"
                exit 1
              fi
