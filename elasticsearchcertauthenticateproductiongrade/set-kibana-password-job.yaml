apiVersion: batch/v1
kind: Job
metadata:
  name: set-kibana-password
  namespace: elk
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: set-password
          image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
          command: ["/bin/bash", "-c"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "50m"
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: elastic-password
            - name: KIBANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: kibana-password
          args:
            - |
              echo "Waiting for Elasticsearch to be up..."
              until curl -sk https://elasticsearch:9200 -o /dev/null -w "%{http_code}" | grep -q "401"; do
                echo "  waiting for 401 response..."
                sleep 5
              done

              echo "Waiting for cluster state to recover..."
              until curl -sk -u "elastic:${ELASTIC_PASSWORD}" \
                https://elasticsearch:9200/_cluster/health -o /dev/null -w "%{http_code}" | grep -q "200"; do
                echo "  waiting for cluster health 200..."
                sleep 5
              done

              echo "Setting kibana_system password..."
              STATUS=$(curl -sk -o /dev/null -w "%{http_code}" -X POST \
                -u "elastic:${ELASTIC_PASSWORD}" \
                -H "Content-Type: application/json" \
                https://elasticsearch:9200/_security/user/kibana_system/_password \
                -d "{\"password\":\"${KIBANA_PASSWORD}\"}")

              if [ "$STATUS" = "200" ]; then
                echo "kibana_system password set successfully"
              else
                echo "ERROR: Failed to set kibana_system password (HTTP $STATUS)"
                exit 1
              fi
