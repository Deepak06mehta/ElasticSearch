# =============================================================================
# cluster-issuer.yaml
# =============================================================================
# Purpose: Defines two cert-manager ClusterIssuers that form a 2-tier
# Certificate Authority chain for Elasticsearch TLS.
#
# Certificate Chain:
#   selfsigned-issuer (self-signed root)
#     └── signs → es-ca Certificate (intermediate CA)
#                   └── es-ca-issuer (references es-ca-secret)
#                         └── signs → es-node Certificate (leaf certs for ES)
#
# Why TWO issuers?
#   cert-manager requires a root of trust. We create a temporary self-signed
#   issuer just to bootstrap a proper CA certificate. That CA certificate is
#   then used as the trust anchor for all Elasticsearch node certificates.
#
# Why ClusterIssuer instead of Issuer?
#   ClusterIssuer is a cluster-scoped resource (not namespace-scoped). It can
#   issue certificates in ANY namespace. This lets es-ca-issuer (defined once)
#   sign certificates in the 'elk' namespace while the CA secret lives in the
#   'cert-manager' namespace (required for ca-type issuers — see Issue #1).
# =============================================================================

---
# ---------------------------------------------------------------------------
# ClusterIssuer: selfsigned-issuer
# ---------------------------------------------------------------------------
# This is the ROOT of the certificate chain — a temporary self-signed issuer
# used only to bootstrap the CA certificate (es-ca).
#
# How it works:
#   1. cert-manager generates a random key pair
#   2. The Certificate resource (ca-certificate.yaml) asks this issuer to sign it
#   3. The result is stored in a Kubernetes Secret (es-ca-secret)
#   4. Once the CA cert exists, es-ca-issuer takes over as the real issuer
#
# Security note: self-signed issuers are ONLY for bootstrapping. In production,
# you would use an external CA (e.g. LetsEncrypt, HashiCorp Vault PKI, or
# your organization's internal CA).
# ---------------------------------------------------------------------------
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  # selfSigned: {} tells cert-manager to generate a self-signed certificate.
  # No external CA is involved — cert-manager creates the key pair itself.
  selfSigned: {}

---
# ---------------------------------------------------------------------------
# ClusterIssuer: es-ca-issuer
# ---------------------------------------------------------------------------
# This is the "real" issuer that signs Elasticsearch node certificates.
# It references the CA key pair stored in the Kubernetes Secret 'es-ca-secret'.
#
# IMPORTANT: For a 'ca' type ClusterIssuer, the secret MUST be in the
# cert-manager namespace (not in elk). This is because ClusterIssuer is
# cluster-scoped but cert-manager controllers run in the cert-manager
# namespace and can only read secrets from their own namespace.
#
# The Secret 'es-ca-secret' is created by the es-ca Certificate resource
# defined in ca-certificate.yaml (which lives in the cert-manager namespace).
# ---------------------------------------------------------------------------
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: es-ca-issuer
spec:
  ca:
    # secretName: The name of the Kubernetes Secret containing the CA key pair.
    # This secret MUST exist in the cert-manager namespace BEFORE this
    # ClusterIssuer can issue any certificates. The secret is created by
    # the es-ca Certificate resource.
    secretName: es-ca-secret
