# =============================================================================
# ingest-statefulset.yaml — Elasticsearch Ingest Node
# =============================================================================
# Purpose: Defines the Elasticsearch node with the "ingest" role only.
# Ingest nodes pre-process documents before indexing — they run ingest
# pipelines (e.g. parsing logs, enriching data, removing fields).
#
# ARCHITECTURE RATIONALE:
# We separate ingest from master+data for two reasons:
#   1. Resource isolation — ingest processing is CPU-intensive and could
#      slow down cluster coordination if it ran on the master node.
#   2. Node affinity — ingest runs on Node 2 (minikube-m02), spreading
#      the load away from the control-plane and master-data nodes.
#
# DIFFERENCES FROM MASTER-DATA STATEFULSET:
#   - Roles: "ingest" only (no master, no data)
#   - No fix-permissions init container (ingest stores state in memory/disk
#     but does NOT hold data shards — PVC is only for node metadata)
#   - Smaller heap: 384m (vs 256m on master-data)
#   - No AlwaysPreTouch (pre-committing heap on a 384m heap wastes RAM)
#   - Runs on minikube-m02 (ingest=true label)
#   - Data path: still has a PVC for node state + ingestion queue buffers
#   - NO persistent shards — if this pod dies, no data loss
#
# COMMUNICATION:
#   Internal (Transport):
#     - discovery.seed_hosts: "es-master-data-0.es-master-data"
#     - Resolves via headless service DNS (cross-node via Calico/CNI overlay)
#     - Connects to master over port 9300 with mutual TLS
#     - Sends join request → master accepts → receives cluster state
#
#   External (HTTP):
#     - Clients send documents to http(s)://es-ingest:9200/_bulk or _ingest
#     - Ingest processes pipelines, then forwards to master-data for indexing
#     - Headless service "es-ingest" resolves to this pod's IP
# =============================================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: es-ingest
  namespace: elk
spec:
  # serviceName: Links to the es-ingest headless service for DNS discovery.
  # Pod DNS: es-ingest-0.es-ingest.elk.svc.cluster.local
  serviceName: es-ingest
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
      role: ingest
  template:
    metadata:
      labels:
        app: elasticsearch
        role: ingest
    spec:
      # nodeSelector: Forces this pod to run on the ingest-labeled node
      # (minikube-m02). This separation keeps CPU-heavy ingest processing
      # away from the master-data and control-plane nodes.
      nodeSelector:
        node-role.kubernetes.io/ingest: "true"

      securityContext:
        fsGroup: 1000

      # -----------------------------------------------------------------------
      # Init Container: prepare-certs
      # -----------------------------------------------------------------------
      # Same cert-copy logic as master-data. Copies TLS certs from the
      # Secret volume to a shared emptyDir with correct ownership.
      #
      # The SAME Secret (elastic-certs) is used for ALL ES nodes. The
      # certificate has SAN entries for both es-master-data-0.es-master-data
      # AND es-ingest-0.es-ingest, so it's valid for both.
      # -----------------------------------------------------------------------
      initContainers:
        - name: prepare-certs
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cp /certs/ca.crt /es-certs/ca.crt
              cp /certs/tls.crt /es-certs/es.crt
              cp /certs/tls.key /es-certs/es.key
              chmod 640 /es-certs/*
              chown 1000:0 /es-certs/*
          volumeMounts:
            - name: elastic-certs
              mountPath: /certs
            - name: es-certs-dir
              mountPath: /es-certs

      # -----------------------------------------------------------------------
      # Main Container: elasticsearch
      # -----------------------------------------------------------------------
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
          securityContext:
            runAsUser: 1000
            runAsGroup: 0
          ports:
            - containerPort: 9200
            - containerPort: 9300
          env:
            # node.name: Automatically set to pod name (es-ingest-0)
            - name: node.name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            # cluster.name: Must match master-data's cluster name
            - name: cluster.name
              valueFrom:
                configMapKeyRef:
                  name: elasticsearch-config
                  key: cluster.name

            # node.roles: Only "ingest" — this node does NOT store data
            # and does NOT participate in master election.
            - name: node.roles
              value: "ingest"

            # discovery.seed_hosts: Points to the master-data node's DNS.
            # On startup, the ingest node resolves this DNS name to find
            # the master and sends a join request over transport (port 9300).
            - name: discovery.seed_hosts
              value: "es-master-data-0.es-master-data"

            # network.publish_host: The IP the ingest node advertises to
            # the master for transport communication. This must be the
            # pod's routable IP within the cluster network.
            - name: network.publish_host
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            # ELASTIC_PASSWORD: Not strictly needed by ingest (it doesn't
            # authenticate outbound), but ES auto-configuration sets this
            # as the elastic user password. We set it from Vault to ensure
            # consistency across all nodes.
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: elastic-password

            # ES_JAVA_OPTS: JVM heap for ingest node.
            # -Xms1500m -Xmx1500m = 1.5 GB heap (fixed, no dynamic resizing)
            #
            # WHY 1.5g?
            # GC events during ES startup are driven by cluster-state allocation
            # rate (processing ~30 Kibana indices on join), not heap exhaustion.
            # Heap sizes 1.3g–1.8g all produce 1–2 events during the first 11
            # seconds of join (gc #3–13), varying between INFO and WARN based on
            # timing. 1.5g is the sweet spot: the best observed run had zero WARN
            # (1 INFO event at 286ms), and it keeps RSS at ~2.0Gi, leaving 500Mi
            # headroom for OOM safety.
            #
            # WHY NOT LARGER?
            # 1.6g → 1 WARN gc #13 (1.4s/1.7s, 82%). Larger heap = fewer but
            # longer GC cycles, sometimes exceeding the WARN threshold. More
            # heap also means more RSS with diminishing returns.
            #
            # WHY 2.5Gi limit?
            # 1.5g heap + ~500m non-heap overhead = ~2.0Gi RSS. The extra 500m
            # headroom prevents OOM during GC-heavy bursts.
            #
            # WHY AlwaysPreTouch?
            # Pre-commits all heap pages at startup so the JVM doesn't waste
            # CPU cycles on lazy allocation during the critical cluster-join
            # phase.
            - name: ES_JAVA_OPTS
              value: "-Xms1500m -Xmx1500m -XX:+AlwaysPreTouch"

            # --- Same TLS settings as master-data ---
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.license.self_generated.type
              value: "basic"
            - name: xpack.security.http.ssl.enabled
              value: "true"
            - name: xpack.security.http.ssl.key
              value: /usr/share/elasticsearch/config/certs/es.key
            - name: xpack.security.http.ssl.certificate
              value: /usr/share/elasticsearch/config/certs/es.crt
            - name: xpack.security.http.ssl.certificate_authorities
              value: /usr/share/elasticsearch/config/certs/ca.crt
            - name: xpack.security.http.ssl.verification_mode
              value: certificate
            - name: xpack.security.transport.ssl.enabled
              value: "true"
            - name: xpack.security.transport.ssl.key
              value: /usr/share/elasticsearch/config/certs/es.key
            - name: xpack.security.transport.ssl.certificate
              value: /usr/share/elasticsearch/config/certs/es.crt
            - name: xpack.security.transport.ssl.certificate_authorities
              value: /usr/share/elasticsearch/config/certs/ca.crt
            - name: xpack.security.transport.ssl.verification_mode
              value: certificate
            - name: xpack.security.transport.ssl.client_authentication
              value: "required"

            # --- Disable unused features ---
            - name: xpack.ml.enabled
              value: "false"
            - name: xpack.watcher.enabled
              value: "false"
            - name: xpack.monitoring.collection.enabled
              value: "false"
            - name: xpack.profiling.enabled
              value: "false"

          # -------------------------------------------------------------------
          # Readiness Probe
          # -------------------------------------------------------------------
          # Uses bash's built-in TCP check on port 9200. Fast and reliable
          # (<100ms) — avoids the curl+TLS timeout issue.
          #
          # initialDelaySeconds=180: ES ingest takes ~3 min to start. 180s
          # covers the typical startup so you see zero probe failures.
          # -------------------------------------------------------------------
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - timeout 5 bash -c 'echo > /dev/tcp/localhost/9200' 2>/dev/null
            initialDelaySeconds: 180
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          # -------------------------------------------------------------------
          # Resource Requests & Limits
          # -------------------------------------------------------------------
          # Slightly less than master-data since ingest does not store shards.
          # But still generous enough to avoid GC thrashing (Issue #8).
          # -------------------------------------------------------------------
          resources:
            requests:
              memory: "1Gi"
              cpu: "150m"
            limits:
              memory: "2.5Gi"
              cpu: "400m"

          volumeMounts:
            - name: es-certs-dir
              mountPath: /usr/share/elasticsearch/config/certs

      terminationGracePeriodSeconds: 30

      volumes:
        - name: elastic-certs
          secret:
            secretName: elastic-certs
            defaultMode: 0600
        - name: es-certs-dir
          emptyDir: {}

  # ---------------------------------------------------------------------------
  # volumeClaimTemplates: PVC for Ingest Node
  # ---------------------------------------------------------------------------
  # Ingest nodes have a data path for:
  #   - Node state (metadata about the node itself)
  #   - Ingest queue buffers (temporary storage during processing)
  #   - Logs if log files are written to the data path
  #
  # IMPORTANT: Ingest nodes do NOT hold primary/replica shards. If this PVC
  # is deleted, no user data is lost. Only the node's identity and some
  # cached state would need to be recreated.
  # ---------------------------------------------------------------------------
  volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-hostpath
